services:
  - type: web
    name: club-matias-megias-navarro-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: DATABASE_URL
        fromDatabase:
          name: club-matias-megias-navarro-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-admin-key.json
      - key: REMINDER_INTERNAL_SECRET
        sync: false
      - key: RECOVERY_NOTIFIER_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Club Matias Megias Navarro
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: BREVO_TIMEOUT_SECONDS
        value: "10"

databases:
  - name: club-matias-megias-navarro-postgres
    plan: free
